<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tienda EcoLusiona</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@400;600;800&display=swap">
<style id="eco-css">
/* Layout: tienda de una columna centrada (máx. 1080px); grilla de tarjetas que pasa a 1 columna en celular; barra superior fija con carrito. Tema claro único, fiel a la marca. */
:root{
  --verde:#4A7C59; --verde-osc:#3A6447; --verde-2:#7BA05D; --salvia:#A7B88C;
  --beige:#E8E1D2; --papel:#FAF7F0; --blanco:#FFFFFF; --cafe:#8C5E34; --miel:#F4C430; --miel-osc:#D9A90F;
  --tinta:#33291F; --tinta-2:#6B5E50; --linea:#DDD3C0;
  --f-cuerpo:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-mano:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --r:14px;
}
*{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:var(--f-cuerpo);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blanco)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--miel-osc);outline-offset:2px;border-radius:6px}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--blanco);border-bottom:1px solid var(--linea)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.logo-btn{background:none;border:0;padding:0;display:flex}
.logo-btn img{height:46px;width:auto}
.nav{display:flex;gap:6px;align-items:center}
.nav-link{background:none;border:0;padding:8px 10px;border-radius:10px;font-weight:700;color:var(--tinta-2)}
.nav-link:hover{background:var(--beige);color:var(--tinta)}
.cart-btn{display:flex;align-items:center;gap:8px;background:var(--verde);color:#fff;border:0;border-radius:999px;padding:9px 16px;font-weight:800}
.cart-btn:hover{background:var(--verde-osc)}
.cart-btn svg{width:20px;height:20px}
.badge{background:var(--miel);color:var(--tinta);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:13px;padding:0 6px}
@media (max-width:520px){.nav-link{display:none}.logo-btn img{height:38px}}

main{padding-block:24px 64px}
.screen{display:flex;flex-direction:column;gap:28px}

/* inicio: hero de marca */
section[id]{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 84px)}
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1.15fr 1fr;gap:28px;align-items:center;background:var(--beige);border-radius:24px;padding:36px}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(123,160,93,.22),rgba(123,160,93,0) 70%);pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:6px;background:var(--blanco);color:var(--verde-osc);border-radius:999px;padding:5px 12px 5px 8px;font-weight:800;font-size:.85rem;letter-spacing:.02em}
.eyebrow svg{width:18px;height:18px}
.hero h1{font-size:clamp(1.8rem,4.2vw,2.75rem);font-weight:800;color:var(--verde-osc);margin-top:14px;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--cafe)}
.hero p.bajada{color:var(--tinta-2);max-width:50ch;margin-top:12px;font-size:1.05rem}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.hero .lema{font-family:var(--f-mano);font-size:1.6rem;color:var(--cafe);margin-top:16px;display:flex;align-items:center;gap:8px}
.ingr{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ingr-t{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--verde-osc)}
.hexes{position:relative;width:330px;height:262px;max-width:100%;margin-top:6px}
.hex{position:absolute;width:128px;height:146px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--blanco);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:0 14px}
.hex:nth-child(1){left:0;top:0}
.hex:nth-child(2){left:134px;top:0;background:#FDF3CF}
.hex:nth-child(3){left:67px;top:114px;background:#EEF3E8}
.hex:nth-child(4){left:201px;top:114px}
.hex svg{width:40px;height:40px}
.hex b{font-size:.86rem;line-height:1.15}
.hex span{font-size:.72rem;color:var(--tinta-2);line-height:1.2}
@media (max-width:400px){.hexes{transform:scale(.86);transform-origin:top center;height:226px}}
.bee-fly{position:absolute;top:-6px;right:0;width:120px;height:80px;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.bee-fly .bee{animation:zumbido 2.4s ease-in-out infinite}}
@keyframes zumbido{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(-4px,-6px) rotate(4deg)}}
@media (max-width:800px){.hero{grid-template-columns:1fr;padding:24px 20px}}

/* cómo se usa */
.howto{display:flex;flex-direction:column;gap:18px}
.howto-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.howto-head h2{font-size:1.5rem;font-weight:800}
.howto-head p{color:var(--tinta-2);max-width:56ch}
.ciclo{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
@media (max-width:860px){.ciclo{grid-template-columns:1fr}}
.stage{position:relative;background:var(--blanco);border:1px solid var(--linea);border-radius:22px;padding:22px;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:14px;overflow:hidden}
.stage-art{background:linear-gradient(180deg,#F3EFE4,#EAE3D3);border-radius:16px;display:grid;place-items:center;aspect-ratio:5/3;max-width:100%}
.stage-art svg{width:min(320px,90%);height:auto}
.stage-n{font-family:var(--f-mano);font-size:1.5rem;color:var(--cafe)}
.stage h3{font-size:1.45rem;font-weight:800;color:var(--verde-osc)}
.stage p{color:var(--tinta-2);max-width:48ch}
.stage .tip{display:flex;gap:8px;align-items:flex-start;background:#FDF6DC;border-radius:12px;padding:10px 12px;font-size:.92rem}
.stage .tip svg{flex:none;width:20px;height:20px;margin-top:2px}
.stage-nav{display:flex;gap:8px;justify-content:space-between;align-items:center}
.prog{flex:1;height:5px;background:var(--beige);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--verde-2)}
.prog.run i{animation:avanza 4.8s linear forwards}
@keyframes avanza{to{width:100%}}
.round{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--linea);background:var(--blanco);font-weight:800;color:var(--verde-osc);display:grid;place-items:center}
.round:hover{border-color:var(--verde)}
.step-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:8px;position:relative}
.step-btn{width:100%;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;text-align:left;background:var(--blanco);border:1.5px solid var(--linea);border-radius:16px;padding:8px 12px 8px 8px;transition:border-color .2s,background .2s}
.step-btn .mini{width:56px;height:56px;border-radius:12px;background:var(--beige);display:grid;place-items:center}
.step-btn .mini svg{width:46px;height:auto}
.step-btn b{display:block;font-size:1rem}
.step-btn .st{min-width:0}
.step-btn small{display:block;color:var(--tinta-2);font-size:.85rem}
.step-btn[aria-current=step]{border-color:var(--verde);background:#F1F6EC}
.step-btn[aria-current=step] .mini{background:var(--salvia)}
.step-btn:hover{border-color:var(--verde-2)}
.loop-note svg{width:24px;height:24px;flex:none}
.loop-note{display:flex;align-items:center;gap:8px;color:var(--cafe);font-family:var(--f-mano);font-size:1.3rem;padding-left:6px}
.evita{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--blanco);border:1px dashed var(--cafe);border-radius:14px;padding:12px 16px}
.evita b{color:var(--cafe)}
.evita span{display:inline-flex;align-items:center;gap:6px;font-size:.93rem}
.evita svg{width:22px;height:22px;flex:none}
@media (max-width:860px){.step-list{grid-template-columns:repeat(3,minmax(0,1fr))}.step-btn{grid-template-columns:1fr;justify-items:center;text-align:center;padding:8px}.step-btn small{display:none}.step-btn b{font-size:.82rem;line-height:1.2}}
@media (max-width:400px){.step-btn .mini{width:48px;height:48px}.step-btn .mini svg{width:40px}}
/* animación de escenas */
@media (prefers-reduced-motion:no-preference){
  .stage-art svg{animation:entra .45s ease-out}
  .a-arruga{animation:arruga 1.6s ease-in-out infinite;transform-origin:100px 80px}
  .a-manoI{animation:empujaI 1.6s ease-in-out infinite}
  .a-manoD{animation:empujaD 1.6s ease-in-out infinite}
  .a-cae{animation:cae 1.2s linear infinite}
  .a-cae2{animation:cae 1.2s linear .4s infinite}
  .a-cae3{animation:cae 1.2s linear .8s infinite}
  .a-calor{animation:calor 1.8s ease-in-out infinite}
  .a-col{animation:columpio 2.6s ease-in-out infinite;transform-origin:100px 34px}
  .a-gira{animation:gira 8s linear infinite;transform-origin:100px 82px}
  .a-baja{animation:baja 2.4s ease-in-out infinite}
}
@keyframes entra{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes arruga{0%,100%{transform:scale(1,1)}50%{transform:scale(.9,.95) rotate(-3deg)}}
@keyframes empujaI{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
@keyframes empujaD{0%,100%{transform:translateX(0)}50%{transform:translateX(-8px)}}
@keyframes cae{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes calor{0%,100%{opacity:.25;transform:translateY(4px)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes columpio{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes baja{0%,100%{transform:translateY(-6px)}50%{transform:translateY(2px)}}

/* nosotros */
.marca{display:grid;grid-template-columns:1fr 1.3fr;gap:24px;align-items:center}
@media (max-width:800px){.marca{grid-template-columns:1fr}}
.nota{position:relative;background:#F1E9D6;border-radius:6px;padding:30px 26px 24px;transform:rotate(-1.2deg);box-shadow:0 8px 20px -12px rgba(51,41,31,.35)}
.nota::before{content:"";position:absolute;top:-12px;left:50%;width:90px;height:24px;margin-left:-45px;background:rgba(232,225,210,.85);border:1px solid rgba(140,94,52,.15);transform:rotate(2deg)}
.nota .t{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--verde-osc)}
.nota p{font-family:var(--f-mano);font-size:1.55rem;line-height:1.3;color:var(--tinta);margin-top:8px}
.valores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.valor{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.valor .vi{width:44px;height:44px;border-radius:50%;background:var(--verde);display:grid;place-items:center}
.valor .vi svg{width:24px;height:24px}
.valor b{display:block}
.valor span{color:var(--tinta-2);font-size:.92rem}
@media (max-width:520px){.valores{grid-template-columns:1fr}}

.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:1.5rem;font-weight:800}
.sec-head p{color:var(--tinta-2)}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card .ph{position:relative;aspect-ratio:4/3;background:var(--beige);max-width:100%}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;right:10px;bottom:10px;background:var(--blanco);border:1.5px solid var(--tinta);border-radius:6px;padding:0 10px;font-family:var(--f-mano);font-size:1.45rem;line-height:1.35;transform:rotate(-3deg);box-shadow:2px 2px 0 rgba(0,0,0,.12)}
.agotado{position:absolute;left:10px;top:10px;background:var(--tinta);color:#fff;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:800}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:1.15rem;font-weight:800}
.card .tl{color:var(--tinta-2);font-size:.93rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--beige);border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:700;color:var(--cafe);font-variant-numeric:tabular-nums}
.card .actions{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 18px;font-weight:800;border:0;text-decoration:none;text-align:center}
.btn-miel{background:var(--miel);color:var(--tinta)}
.btn-miel:hover{background:var(--miel-osc)}
.btn-verde{background:var(--verde);color:#fff}
.btn-verde:hover{background:var(--verde-osc)}
.btn-linea{background:var(--blanco);color:var(--verde-osc);border:1.5px solid var(--verde)}
.btn-linea:hover{background:#EEF3E8}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-sm{padding:7px 12px;font-size:.9rem;border-radius:10px}
.back{align-self:flex-start;background:none;border:0;color:var(--verde-osc);font-weight:800;padding:6px 0}


/* producto */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
@media (max-width:800px){.pd{grid-template-columns:1fr}}
.pd-ph{position:relative;border-radius:18px;overflow:hidden;background:var(--beige)}
.pd-ph img{width:100%;display:block}
.pd-info{display:flex;flex-direction:column;gap:16px;min-width:0}
.pd-info h1{font-size:clamp(1.6rem,3.5vw,2.2rem);font-weight:800;color:var(--verde-osc)}
.precio{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.precio small{font-size:.9rem;color:var(--tinta-2);font-weight:600}
.box{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:16px}
.box h2{font-size:1.05rem;font-weight:800;margin-bottom:10px}
.escala{background:linear-gradient(180deg,#F6F2E8,#EFE8D8);border-radius:12px;padding:14px 10px 8px;overflow-x:auto}
.escala svg{display:block;width:100%;height:auto;min-width:280px}
.usos{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.usos li{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:start}
.usos .dot{width:14px;height:14px;border-radius:4px;margin-top:4px}
.usos b{font-variant-numeric:tabular-nums}
.usos span{display:block;color:var(--tinta-2);font-size:.92rem}
.kit-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.kit-list li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center}
.kit-list .ki{width:40px;height:40px;border-radius:50%;background:#FDF3CF;display:grid;place-items:center}
.kit-list .ki svg{width:24px;height:24px}
.kit-list span{display:block;color:var(--tinta-2);font-size:.9rem}
.qty-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--linea);border-radius:12px;background:var(--blanco)}
.qty button{background:none;border:0;width:40px;height:42px;font-size:1.2rem;font-weight:800;color:var(--verde-osc)}
.qty output{min-width:28px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.edu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.edu{grid-template-columns:1fr}}
.edu .box h3{font-size:1rem;font-weight:800;margin-bottom:6px;color:var(--cafe)}
.edu ul{margin:0;padding-left:18px;color:var(--tinta-2);font-size:.93rem}
.edu2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.edu2{grid-template-columns:1fr}}
.mini svg *{animation:none!important}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{counter-increment:s;display:flex;gap:10px;color:var(--tinta-2);font-size:.93rem}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--miel);color:var(--tinta);font-weight:800;display:grid;place-items:center;font-size:.8rem}
.upsell{display:flex;gap:14px;align-items:center;background:#FDF6DC;border:1px solid #EFDCA0;border-radius:var(--r);padding:12px}
.upsell img{width:72px;height:72px;object-fit:cover;border-radius:10px;flex:none}
.upsell div{flex:1;min-width:0}
.upsell span{color:var(--tinta-2);font-size:.9rem}

/* carrito */
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;align-items:start}
@media (max-width:800px){.two{grid-template-columns:1fr}}
.lines{display:flex;flex-direction:column;gap:12px}
.line{display:grid;grid-template-columns:80px 1fr auto;gap:14px;align-items:center;background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:12px}
.line img{width:80px;height:80px;object-fit:cover;border-radius:10px}
.line .nm{font-weight:800}
.line .meta{color:var(--tinta-2);font-size:.9rem;font-variant-numeric:tabular-nums}
.line .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.line .sub{font-weight:800;font-variant-numeric:tabular-nums}
.link-del{background:none;border:0;color:var(--tinta-2);text-decoration:underline;font-size:.85rem;padding:0}
@media (max-width:520px){.line{grid-template-columns:64px 1fr}.line img{width:64px;height:64px}.line .right{grid-column:1 / -1;flex-direction:row;justify-content:space-between;align-items:center}}
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.row.total{font-size:1.25rem;font-weight:800;border-top:1px solid var(--linea);padding-top:10px}
.muted{color:var(--tinta-2);font-size:.9rem}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}

/* pagar */
form .fld{display:flex;flex-direction:column;gap:4px}
form label{font-weight:800;font-size:.93rem}
input[type=text],input[type=tel],input[type=number],input[type=url],textarea{width:100%;border:1.5px solid var(--linea);border-radius:10px;padding:10px 12px;background:var(--blanco)}
input:focus,textarea:focus{border-color:var(--verde);outline:none}
.err{color:#A33A1E;font-size:.85rem;font-weight:700}
.paso{display:flex;gap:12px;align-items:flex-start}
.paso .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--verde);color:#fff;font-weight:800;display:grid;place-items:center}
.paso > div{min-width:0;flex:1}
.copy{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.copy code{background:var(--beige);border-radius:8px;padding:6px 10px;font-weight:800;font-family:var(--f-cuerpo);font-variant-numeric:tabular-nums;word-break:break-word;user-select:all}
.scale{display:flex;gap:8px;flex-wrap:wrap}
.scale button{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--linea);background:var(--blanco);font-weight:800;font-size:1.05rem}
.scale button[aria-pressed=true]{background:var(--verde);border-color:var(--verde);color:#fff}
.scale-lbl{display:flex;justify-content:space-between;max-width:272px;font-size:.8rem;color:var(--tinta-2)}

footer{border-top:1px solid var(--linea);background:var(--beige)}
footer .wrap{padding-block:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--tinta-2);font-size:.9rem}
footer .lema{font-family:var(--f-mano);font-size:1.4rem;color:var(--verde-osc)}
.admin-open{background:none;border:1px dashed var(--cafe);color:var(--cafe);border-radius:10px;padding:6px 12px;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center}
.toast button{background:var(--miel);color:var(--tinta);border:0;border-radius:8px;padding:4px 10px;font-weight:800}

/* panel equipo */
.admin{position:fixed;inset:0;z-index:30;background:rgba(51,41,31,.45);display:flex;justify-content:flex-end}
.admin-panel{background:var(--papel);width:min(720px,100%);height:100%;overflow-y:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) 20px;padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:16px}
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tabs{display:flex;gap:6px}
.tabs button{border:1.5px solid var(--linea);background:var(--blanco);border-radius:999px;padding:6px 14px;font-weight:800}
.tabs button[aria-selected=true]{background:var(--verde);border-color:var(--verde);color:#fff}
.ed{display:grid;grid-template-columns:96px 1fr;gap:14px}
.ed img{width:96px;height:96px;object-fit:cover;border-radius:10px}
.ed .fields{display:grid;gap:8px;min-width:0}
.ed .two-f{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.ed{grid-template-columns:1fr}.ed .two-f{grid-template-columns:1fr}}
.chk{display:flex;gap:8px;align-items:center;font-weight:700}
.funnel{display:grid;gap:8px}
.fbar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:.9rem}
.fbar .bar{height:14px;background:var(--beige);border-radius:999px;overflow:hidden}
.fbar .bar i{display:block;height:100%;background:var(--verde-2)}
.fbar b{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){.fbar{grid-template-columns:110px 1fr 56px}}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--linea);vertical-align:top}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
</style>

<script id="eco-app">
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("eco-data").textContent);
var root = document.getElementById("eco-root");
var clp = function(n){ return "$" + Math.round(n).toLocaleString("es-CL"); };
var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); };
var store = {
  get:function(k,d){ try{ var v = localStorage.getItem("eco_"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem("eco_"+k, JSON.stringify(v)); }catch(e){} }
};
var S = { view:"catalogo", pid:null, qty:1, cart: store.get("cart", {}), order:null, paid:false, survey:{facil:0, freno:""}, surveyDone:false };
function prod(id){ for (var i=0;i<DATA.products.length;i++) if (DATA.products[i].id===id) return DATA.products[i]; return null; }
function cartCount(){ var n=0; for (var k in S.cart) if (prod(k)) n+=S.cart[k]; return n; }
function cartTotal(){ var t=0; for (var k in S.cart){ var p=prod(k); if (p) t+=p.price*S.cart[k]; } return t; }
function saveCart(){ store.set("cart", S.cart); }

var sid = (function(){ try{ var s=sessionStorage.getItem("eco_sid"); if(!s){ s="s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); sessionStorage.setItem("eco_sid",s);} return s; }catch(e){ return "s"+Date.now().toString(36); } })();
var LOG = { inicio: new Date().toISOString(), eventos: [], pedido: null, encuesta: null, celular: matchMedia("(max-width:640px)").matches };
var sesDoc = null, writing = Promise.resolve(), flushT = null;
function track(tipo, extra){
  var e = { t: new Date().toISOString(), tipo: tipo };
  if (extra) for (var k in extra) e[k] = extra[k];
  if (LOG.eventos.length < 200) LOG.eventos.push(e);
  scheduleFlush();
}
function scheduleFlush(){ clearTimeout(flushT); flushT = setTimeout(flush, 800); }
function flush(){
  if (!sesDoc) return;
  var snap = JSON.parse(JSON.stringify(LOG));
  writing = writing.then(function(){ return sesDoc.set(snap); }).catch(function(){});
}
var cap = { db:null, user:null, artifact:null, assets:null, canEdit:false };
(async function initCaps(){
  if (!window.claude || !window.claude.use) return;
  try{
    var r = await Promise.all([claude.use("db"), claude.use("user"), claude.use("artifact"), claude.use("assets")]);
    cap.db=r[0]; cap.user=r[1]; cap.artifact=r[2]; cap.assets=r[3];
    if (cap.user) { try{ cap.canEdit = !!(await cap.user.canEdit()); }catch(e){} }
    if (cap.db && cap.user){
      var can = null; try{ can = await cap.user.can("data.write"); }catch(e){}
      if (can !== false){
        var uid = await cap.user.id();
        if (uid){
          try{
            await cap.db.doc("registro/"+uid).set({ visto: new Date().toISOString() });
            sesDoc = cap.db.doc("registro/"+uid+"/sesiones/"+sid);
            flush();
          }catch(e){ sesDoc = null; }
        }
      }
    }
    if (cap.canEdit) renderFooter();
  }catch(e){}
})();

function go(view, pid, sec){
  var prev = S.view;
  S.view = view;
  if (pid) { S.pid = pid; S.qty = 1; }
  if (view !== prev || pid) { HOW.i = 0; HOW.auto = true; }
  if (view !== prev || pid || !document.getElementById(sec || "_")) render();
  if (sec){ var el = document.getElementById(sec); if (el) el.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth"}); }
  else window.scrollTo(0,0);
  if (view === "producto") track("ver_producto", {producto: pid});
  if (view === "carrito") track("ver_carrito", {items: cartCount(), total: cartTotal()});
  if (view === "pagar") track("ir_a_pagar", {items: cartCount(), total: cartTotal()});
  if (sec === "como") track("ver_como_se_usa", {});
}

/* Tamaños dibujados a escala, con un limón de referencia */
function escalaSVG(items){
  var U = 6, gap = 3.5, x = 1, maxH = 0, fills = ["url(#p-verde)","url(#p-miel)","url(#p-cafe)"], strokes = ["#3A6447","#8C5E34","#8C5E34"];
  var rects = items.map(function(c){ var m = c.size.match(/(\d+)\s*[x×]\s*(\d+)/i); return { w:+m[1], h:+m[2], label: m[1] + "×" + m[2] }; });
  rects.forEach(function(r){ maxH = Math.max(maxH, r.h); });
  var limon = 7, out = "";
  var base = maxH + 2;
  out += '<g><circle cx="' + ((x + limon/2) * U) + '" cy="' + ((base - limon/2) * U) + '" r="' + (limon/2*U) + '" fill="#F4E04D" stroke="#B59A14" stroke-width="1.5"/><path d="M' + ((x+limon/2)*U) + ' ' + ((base-limon)*U - 2) + 'q4 -6 10 -4" stroke="#4A7C59" stroke-width="2" fill="none"/><text x="' + ((x + limon/2) * U) + '" y="' + ((base + 4.2) * U) + '" text-anchor="middle" font-size="15" fill="#6B5E50" font-family="Nunito, sans-serif">limón</text></g>';
  x += limon + gap;
  rects.forEach(function(r, i){
    out += '<rect x="' + (x*U) + '" y="' + ((base - r.h)*U) + '" width="' + (r.w*U) + '" height="' + (r.h*U) + '" rx="5" fill="' + fills[i % 3] + '" stroke="' + strokes[i % 3] + '" stroke-width="2"/>';
    out += '<text x="' + ((x + r.w/2)*U) + '" y="' + ((base + 4.2)*U) + '" text-anchor="middle" font-size="19" font-weight="800" fill="#33291F" font-family="Nunito, sans-serif">' + r.label + ' cm</text>';
    x += r.w + gap;
  });
  var W = (x - gap + 1) * U, H = (base + 6) * U;
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Tamaños de las telas a escala, junto a un limón de referencia">' + out + '</svg>';
}

function copyText(t, btn){
  var done = function(){ var o = btn.textContent; btn.textContent = "Copiado"; setTimeout(function(){ btn.textContent = o; }, 1500); };
  try{ navigator.clipboard.writeText(t).then(done, function(){ selectNear(btn); }); }catch(e){ selectNear(btn); }
}
function selectNear(btn){ var c = btn.parentNode.querySelector("code"); if (!c) return; var r = document.createRange(); r.selectNodeContents(c); var s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selecciona y copia"; }

document.addEventListener("click", function(ev){
  var t = ev.target.closest("button, a"); if (!t) return;
  var d = t.dataset;
  if (t.id === "eco-mp"){ S.paid = true; track("clic_mercadopago", {total: S.order && S.order.total, codigo: S.order && S.order.code}); setTimeout(render, 400); return; }
  if (d.paso != null){ setPaso(+d.paso, true); return; }
  if (d.pasoMov){ setPaso(HOW.i + (+d.pasoMov), true); return; }
  if (d.go){ ev.preventDefault(); document.getElementById("eco-toast").innerHTML=""; go(d.go, d.pid, d.sec); return; }
  if (d.add){
    var p = prod(d.add); if (!p || !p.available) return;
    var n = d.withqty ? S.qty : 1;
    S.cart[p.id] = (S.cart[p.id] || 0) + n; saveCart(); renderBadge();
    track("agregar", {producto: p.id, cantidad: n, desde: S.view});
    toast(n + " × " + p.name + " en tu carrito", true);
    if (S.view === "carrito") render();
    return;
  }
  if (d.qty){ S.qty = Math.max(1, Math.min(20, S.qty + (+d.qty))); var o = document.getElementById("eco-qty"); if (o) o.textContent = S.qty; return; }
  if (d.cq){ var k = d.pid; S.cart[k] = Math.max(0, (S.cart[k]||0) + (+d.cq)); if (!S.cart[k]) delete S.cart[k]; saveCart(); track("cambiar_cantidad", {producto:k, cantidad:S.cart[k]||0}); render(); return; }
  if (d.del){ delete S.cart[d.del]; saveCart(); track("eliminar", {producto:d.del}); render(); return; }
  if (d.copy){ copyText(d.copy, t); return; }
  if (d.editOrder){ S.order = null; S.paid = false; render(); return; }
  if (d.facil){ S.survey.facil = +d.facil; t.parentNode.querySelectorAll("button").forEach(function(b){ b.setAttribute("aria-pressed", String(b === t)); }); return; }
  if (d["new"]){ S.cart = {}; saveCart(); S.order = null; S.paid = false; S.surveyDone = false; S.survey = {facil:0, freno:""}; go("catalogo"); return; }
  if (d.admin){ openAdmin(); return; }
});

      '<div class="fld"><label for="s-cui">Cuidados (una línea por consejo)</label><textarea rows="3" id="s-cui" data-s="cuidado">' + esc((st.cuidado||[]).join("\n")) + '</textarea></div>' +
    '</div>' + prods +
    '<div style="position:sticky;bottom:0;background:var(--papel);padding-block:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
      '<button class="btn btn-verde" id="a-save"' + (cap.artifact ? '' : ' disabled') + '>' + (A.saving ? 'Publicando…' : 'Publicar cambios') + '</button>' +
      '<span class="muted" id="a-msg">' + (cap.artifact ? '' : 'Tu cuenta no puede publicar cambios en esta tienda.') + '</span></div>';
}
function adminResultados(){
  if (!cap.db) return '<p class="muted">Los resultados no están disponibles en esta vista.</p>';
  var r = A.results; if (!r) return '<p class="muted">Cargando resultados…</p>';
  var ses = r.sesiones, n = ses.length;
  var has = function(s, tipo){ return (s.eventos||[]).some(function(e){ return e.tipo === tipo; }); };
  var steps = [["Visitas", n], ["Vieron características", ses.filter(function(s){return has(s,"ver_producto");}).length], ["Añadieron al carrito", ses.filter(function(s){return has(s,"agregar");}).length], ["Llegaron a Pagar", ses.filter(function(s){return has(s,"ir_a_pagar");}).length], ["Dejaron sus datos", ses.filter(function(s){return has(s,"datos_pedido");}).length], ["Abrieron Mercado Pago", ses.filter(function(s){return has(s,"clic_mercadopago");}).length]];
  var funnel = steps.map(function(s){ var pct = n ? Math.round(s[1]*100/n) : 0; return '<div class="fbar"><span>' + s[0] + '</span><span class="bar"><i style="width:' + pct + '%"></i></span><b>' + s[1] + ' · ' + pct + '%</b></div>'; }).join("");
  var conSet = ses.filter(function(s){ return (s.eventos||[]).some(function(e){ return e.tipo==="agregar" && e.producto!=="kit"; }); });
  var conKit = conSet.filter(function(s){ return (s.eventos||[]).some(function(e){ return e.tipo==="agregar" && e.producto==="kit"; }); });
  var addsBy = {}; ses.forEach(function(s){ (s.eventos||[]).forEach(function(e){ if (e.tipo==="agregar") addsBy[e.producto] = (addsBy[e.producto]||0) + (e.cantidad||1); }); });
  var enc = ses.filter(function(s){ return s.encuesta; });
  var prom = enc.length ? (enc.reduce(function(a,s){ return a + s.encuesta.facil; }, 0) / enc.length).toFixed(1) : "–";
  var ped = ses.filter(function(s){ return s.pedido; }).sort(function(a,b){ return a.pedido.t < b.pedido.t ? 1 : -1; });
  var celu = ses.filter(function(s){ return s.celular; }).length;
  return '<p class="muted">Solo se registran visitas de personas con sesión iniciada en Claude y permiso para usar la tienda (por ejemplo, pruebas guiadas en un celular del equipo). Los visitantes externos compran igual, pero no quedan en este registro: para ellos, revisa los pagos en Mercado Pago.</p>' +
    '<div class="box"><h3 style="font-weight:800;margin-bottom:10px">Embudo de compra</h3><div class="funnel">' + funnel + '</div><p class="muted" style="margin-top:10px">Desde celular: ' + celu + ' de ' + n + ' visitas.</p></div>' +
    '<div class="box" style="display:grid;gap:6px"><h3 style="font-weight:800">Productos añadidos</h3>' + DATA.products.map(function(p){ return '<div class="row"><span>' + esc(p.name) + '</span><b>' + (addsBy[p.id]||0) + '</b></div>'; }).join("") +
      '<p class="muted">Carritos con un set que además sumaron el kit: ' + conKit.length + ' de ' + conSet.length + (conSet.length ? ' (' + Math.round(conKit.length*100/conSet.length) + '%)' : '') + '.</p></div>' +
    '<div class="box"><h3 style="font-weight:800;margin-bottom:6px">Encuesta (' + enc.length + ' respuestas · facilidad promedio ' + prom + ' de 5)</h3><div class="tbl"><table><thead><tr><th>Facilidad</th><th>¿Qué te frenó o faltó?</th></tr></thead><tbody>' +
      (enc.length ? enc.map(function(s){ return '<tr><td>' + s.encuesta.facil + '</td><td>' + esc(s.encuesta.freno || "—") + '</td></tr>'; }).join("") : '<tr><td colspan="2" class="muted">Aún no hay respuestas.</td></tr>') + '</tbody></table></div></div>' +
    '<div class="box"><h3 style="font-weight:800;margin-bottom:6px">Pedidos registrados (' + ped.length + ')</h3><div class="tbl"><table><thead><tr><th>Código</th><th>Nombre</th><th>WhatsApp</th><th>Comuna</th><th>Total</th><th>Abrió MP</th></tr></thead><tbody>' +
      (ped.length ? ped.map(function(s){ var o = s.pedido; return '<tr><td>' + esc(o.code) + '</td><td>' + esc(o.nombre) + '</td><td>' + esc(o.wsp) + '</td><td>' + esc(o.comuna) + '</td><td>' + clp(o.total) + '</td><td>' + (has(s,"clic_mercadopago") ? "Sí" : "No") + '</td></tr>'; }).join("") : '<tr><td colspan="6" class="muted">Aún no hay pedidos.</td></tr>') + '</tbody></table></div></div>' +
    '<button class="btn btn-linea btn-sm" id="a-reload" style="justify-self:start">Actualizar resultados</button>';
}
async function loadResults(){
  try{
    var users = await cap.db.collection("registro").get();
    var all = [];
    for (var i=0;i<users.docs.length;i++){
      var q = await cap.db.collection("registro/" + users.docs[i].id + "/sesiones").get();
      q.docs.forEach(function(d){ var v = d.data(); if (v) all.push(v); });
    }
    A.results = { sesiones: all };
  }catch(e){ A.results = { sesiones: [] }; }
  if (document.getElementById("eco-admin-bg") && A.tab === "resultados") renderAdmin();
}
document.addEventListener("input", function(ev){
  var t = ev.target; if (!A.draft) return;
  if (t.dataset.s){ A.draft.store[t.dataset.s] = t.dataset.s === "cuidado" ? t.value.split("\n").map(function(x){return x.trim();}).filter(Boolean) : t.value; }
  if (t.dataset.f){
    var p = A.draft.products[+t.dataset.i], f = t.dataset.f;
    if (f === "price") p.price = Math.max(0, Math.round(+t.value || 0));
    else if (f === "available") p.available = t.checked;
    else if (f === "contains") p.contains = t.value.split("\n").map(function(l){ var a = l.split("|"); return { size: (a[0]||"").trim(), use: (a.slice(1).join("|")||"").trim() }; }).filter(function(c){ return c.size; });
    else p[f] = t.value;
  }
});
document.addEventListener("change", async function(ev){
  var t = ev.target;
  if (t.dataset && t.dataset.f === "available" && A.draft){ A.draft.products[+t.dataset.i].available = t.checked; }
  if (t.dataset && t.dataset.photo != null && t.files && t.files[0] && cap.assets){
    var msg = document.getElementById("a-msg"); if (msg) msg.textContent = "Subiendo foto…";
    try{ var r = await cap.assets.upload(t.files[0]); A.draft.products[+t.dataset.photo].image = r.url; renderAdmin(); var m2 = document.getElementById("a-msg"); if (m2) m2.textContent = "Foto lista. Publica para guardarla."; }
    catch(e){ if (msg) msg.textContent = "No se pudo subir la foto (" + (e && e.code || "error") + "). Prueba con una imagen de menos de 20 MB."; }
  }
});
document.addEventListener("click", async function(ev){
  var t = ev.target;
  if (t.id === "eco-admin-bg" || t.id === "a-close"){ closeAdmin(); return; }
  if (t.dataset && t.dataset.atab){ A.tab = t.dataset.atab; renderAdmin(); return; }
  if (t.id === "a-reload"){ A.results = null; renderAdmin(); return; }
  if (t.id === "a-save" && cap.artifact && !A.saving){
    A.saving = true; t.textContent = "Publicando…"; t.disabled = true;
    try{ await cap.artifact.publish(buildDoc(A.draft)); }
    catch(e){
      A.saving = false; t.disabled = false; t.textContent = "Publicar cambios";
      var m = document.getElementById("a-msg");
      if (m) m.textContent = e && e.code === "conflict" ? "Otra persona publicó cambios al mismo tiempo. Recarga y vuelve a intentarlo." : e && (e.code === "not_writer" || e.code === "not_granted") ? "Tu cuenta no tiene permiso para publicar." : "No se pudo publicar (" + (e && e.code || "error") + ").";
    }
  }
});
function buildDoc(data){
  var reset = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  var json = JSON.stringify(data).replace(/</g, "\\u003c");
  var css = document.getElementById("eco-css").textContent;
  var js = document.getElementById("eco-app").textContent;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
    '<title>Tienda EcoLusiona</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@400;600;800&display=swap">\n' +
    '<style id="eco-css">' + css + '</style>\n<script type="application/json" id="eco-data">' + json + '<\/script>\n<div id="eco-root"></div>\n<script id="eco-app">' + js + '<\/script>' +
    '</body></html>';
}

renderFooter();
render();
track("visita", { ref: document.referrer ? "externo" : "directo" });
})();
</script>
